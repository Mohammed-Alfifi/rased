[project]
name = "rased-vision"
version = "0.1.0"
description = "Rased vision service: RTSP ingest, detection, tracking and behaviour rules"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3",
  "lap>=0.5",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "httpx>=0.27",
  "pyyaml>=6",
  "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# training studio worker (python -m rased_trainer.worker)
trainer = ["torch>=2.2", "onnx>=1.16", "scikit-learn>=1.4", "psycopg[binary]>=3.1"]

[project.scripts]
rased-vision = "rased_vision.main:main"
rased-trainer = "rased_trainer.worker:main"

[tool.setuptools.packages.find]
include = ["rased_vision*", "rased_trainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

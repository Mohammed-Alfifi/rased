[project]
name = "rased-vision"
version = "0.1.0"
description = "Rased vision service: RTSP ingest, detection, tracking and behaviour rules"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3",
  "lap>=0.5",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "httpx>=0.27",
  "pyyaml>=6",
  "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rased-vision = "rased_vision.main:main"

[tool.setuptools.packages.find]
include = ["rased_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:postgres]
command=/bin/bash -c 'exec $(ls -d /usr/lib/postgresql/*/bin | head -1)/postgres -D %(ENV_HOME)s/pg/data'
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=/bin/bash -c 'sleep 4 && exec node /app/api/dist/main.js'
directory=/app/api
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:bootstrap]
command=/app/bootstrap.sh
priority=30
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:analytics]
command=/bin/bash -c 'sleep 90 && exec python -m rased_analytics.runner'
priority=40
autorestart=true
environment=RASED_ANALYTICS_EVERY="600"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mediamtx]
command=/usr/local/bin/mediamtx /app/demo/mediamtx.yml
directory=/tmp
priority=40
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:feeder]
command=/bin/bash -c 'sleep 5 && SAMPLES=/app/samples RTSP=rtsp://127.0.0.1:8554 exec /bin/bash /app/demo/feed.sh'
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vision]
command=/bin/bash -c 'sleep 60 && exec python -m rased_vision.main'
directory=/app/vision
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:trainer]
command=/bin/bash -c 'sleep 30 && exec python -m rased_trainer.worker'
directory=/app/vision
priority=70
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# NVIDIA GPU override: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# Needs the NVIDIA Container Toolkit on the host.
services:
  vision:
    build:
      context: ../services/vision
      args:
        BASE: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
        TORCH_INDEX: https://download.pytorch.org/whl/cu124
    environment:
      RASED_DEVICE: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

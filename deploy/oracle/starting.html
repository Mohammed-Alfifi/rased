<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<title>راصد · جاري التجهيز</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111820; color: #e6edf3;
         font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
  p { color: #9fb0c0; line-height: 1.8; margin: .4rem 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #e3a64b; display: inline-block; margin-inline-end: 8px;
         animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
<main>
  <h1><span class="dot"></span>راصد يجهز الآن</h1>
  <p>أول تشغيل يأخذ من 20 إلى 30 دقيقة لبناء النظام وتحميل النماذج، وبعدها دقيقتين مع كل إعادة تشغيل.</p>
  <p>الصفحة تتحدث تلقائياً كل 30 ثانية.</p>
</main>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vision:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/vision } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - run: pip install -e ".[dev]"
      - run: pytest -q

  analytics:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/analytics } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  training-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install numpy scikit-learn onnx onnxruntime
      - name: Train / evaluate / export on synthetic data (pipeline check only)
        run: python training/train_fight.py --synthetic --epochs 2 --out /tmp/fight

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: rased, POSTGRES_PASSWORD: rased, POSTGRES_DB: rased_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rased" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: services/api/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
        env: { RASED_TEST_DATABASE_URL: "postgresql://rased:rased@localhost:5432/rased_test" }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: services/web/package-lock.json }
      - run: npm ci
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [vision, analytics, api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t rased-api services
      - run: docker build -t rased-analytics services/analytics
      - run: docker build -t rased-vision services/vision
      - run: docker build -f deploy/hf/Dockerfile -t rased-demo .
      - name: Compose file is valid
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q

  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Public sample photos download and become clips
        run: python scripts/fetch_samples.py --out /tmp/samples --seconds 5 && ls -la /tmp/samples

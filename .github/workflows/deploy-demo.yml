# Publishes the all-in-one demo to a Hugging Face Space (free CPU hardware).
# Setup (once): docs/hosting.md
#   repository variable  HF_SPACE  = <hf-username>/<space-name>
#   repository secret    HF_TOKEN  = a Hugging Face access token with write permission
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the Space
        run: |
          mkdir /tmp/space
          # The Space only needs sources; binaries (screenshots, weights, videos) are left out
          rsync -a --exclude .git --exclude node_modules --exclude 'docs/images' \
            --exclude '*.png' --exclude '*.jpg' --exclude '*.mp4' --exclude '*.pt' --exclude '*.onnx' ./ /tmp/space/
          cp deploy/hf/Dockerfile /tmp/space/Dockerfile
          cp deploy/hf/SPACE_README.md /tmp/space/README.md
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd /tmp/space
          git init -q -b main
          git config user.name "rased-deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Deployed. The Space builds for ~10 minutes: https://huggingface.co/spaces/${HF_SPACE}"
